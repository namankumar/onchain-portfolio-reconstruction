[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onchain-reconstruction"
version = "0.1.0"
description = "Read-only transaction reconstruction, evidence and balance reconciliation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
onchain-reconstruct = "onchain_reconstruction.cli:main"

[tool.setuptools.packages.find]
include = ["onchain_reconstruction*"]

